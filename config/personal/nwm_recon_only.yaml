run_name: nwm_cdit_xl
results_dir: logs
train: True
batch_size: 4
num_workers: 12
prefetch_factor: 4
model: CDiT-XL/2
lr: 8e-5

# normalization for the action space
normalize: True
grad_clip_val: 10.0
context_size: 4

# distance bounds for distance and action and distance predictions
distance:
  min_dist_cat: -64
  max_dist_cat: 64

# action output params
len_traj_pred: 64

# dataset specific parameters
image_size: 224
datasets:
  recon:
    data_folder: data/recon
    train: data_splits/recon/train/ # path to train folder with traj_names.txt
    test: data_splits/recon/test/ # path to test folder with traj_names.txt
    goals_per_obs: 2

# Weights & Biases logging (rank-0 only). Set enabled: False to turn off.
wandb:
  enabled: True
  project: nwm-recon
  entity: null   # your wandb team/user, or null for your default
  name: null     # run name; null falls back to run_name above
